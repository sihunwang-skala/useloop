<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f4fd8">
    <title>오프라인 · UseLoop</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fafaf8; color: #14171f; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #e4e7ec; border-radius: 20px; background: #fff; box-shadow: 0 12px 40px rgb(20 23 31 / 8%); }
      .logo { color: #1f4fd8; font-size: 18px; font-weight: 800; }
      h1 { margin: 24px 0 8px; font-size: 26px; line-height: 1.3; }
      p { margin: 0; color: #5b6372; line-height: 1.65; }
      button { margin-top: 24px; min-height: 44px; border: 0; border-radius: 10px; padding: 0 18px; background: #1f4fd8; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">UseLoop</div>
      <h1>인터넷 연결을 확인해 주세요.</h1>
      <p>피드백과 계정 정보는 안전을 위해 기기에 오프라인 저장하지 않습니다. 연결이 복구되면 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
